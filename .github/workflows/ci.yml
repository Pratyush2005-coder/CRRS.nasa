name: Backend CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - integration
      - feature/backend

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set test environment variables
        run: |
          echo "SECRET_KEY=test-secret-key-for-testing-only-32-chars-minimum" >> $GITHUB_ENV
          echo "ENVIRONMENT=test" >> $GITHUB_ENV
          echo "DATABASE_URL=sqlite:///:memory:" >> $GITHUB_ENV
          echo "NASA_POWER_BASE_URL=https://power.larc.nasa.gov/api/temporal/daily/point" >> $GITHUB_ENV
          echo "NASA_POWER_TIMEOUT_SECONDS=30.0" >> $GITHUB_ENV

      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pytest-results
          path: backend/.pytest_cache/
          retention-days: 1

  security-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pip-audit scan
        run: |
          pip-audit -r requirements.txt --format=columns

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9

      - name: Run Gitleaks scan (Git history)
        run: |
          gitleaks detect --source=. --config=.gitleaks.toml --redact=100 --verbose